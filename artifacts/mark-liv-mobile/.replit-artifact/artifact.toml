kind = "mobile"
previewPath = "/"
title = "Mark LIV Mobile"
description = "A mobile Android assistant inspired by Mark LIV, with voice-first interaction, local memory, reminders, quick actions, and a holographic companion interface for Samsung Galaxy devices."
version = "1.0.0"
id = "artifacts/mark-liv-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20856

[services.development]
run = "pnpm --filter @workspace/mark-liv-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mark-liv-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mark-liv-mobile", "run", "serve" ]

[services.env]
PORT = "20856"
BASE_PATH = "/"
